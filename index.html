<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Checklist — To‑Do</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app">

    <!-- ===== Header ===== -->
    <header class="app-header">
      <div class="header-top">
        <h1>Checklist<span class="dot">.</span></h1>
        <p class="tagline">Small tasks, tracked on purpose.</p>
      </div>
      <div class="counter" id="counter">
        <span id="counter-active">0</span> active ·
        <span id="counter-total">0</span> total
      </div>
    </header>

    <!-- ===== Add Task Form ===== -->
    <section class="add-task-card" aria-label="Add a new task">
      <div class="row row-main">
        <input
          type="text"
          id="task-input"
          placeholder="What needs doing?"
          maxlength="120"
          autocomplete="off"
        />
        <button id="add-btn" class="btn-primary" type="button">Add</button>
      </div>

      <div class="row row-meta">
        <select id="category-input" aria-label="Category">
          <option value="Personal">Personal</option>
          <option value="School">School</option>
          <option value="Work">Work</option>
          <option value="Home">Home</option>
          <option value="Health">Health</option>
        </select>

        <input type="datetime-local" id="time-input" aria-label="Due date and time" />

        <select id="repeat-input" aria-label="Repeat">
          <option value="none">No repeat</option>
          <option value="daily">Daily</option>
          <option value="weekly">Weekly</option>
          <option value="monthly">Monthly</option>
          <option value="yearly">Yearly</option>
        </select>

        <select id="priority-input" aria-label="Priority">
          <option value="low">Low priority</option>
          <option value="medium" selected>Medium priority</option>
          <option value="high">High priority</option>
        </select>
      </div>
    </section>

    <!-- ===== Toolbar: search + filters ===== -->
    <section class="toolbar">
      <input
        type="text"
        id="search-input"
        class="search"
        placeholder="Search tasks…"
        autocomplete="off"
      />
      <div class="filters" id="filters" role="group" aria-label="Filter tasks">
        <button class="filter-btn active" data-filter="all" type="button">All</button>
        <button class="filter-btn" data-filter="active" type="button">Active</button>
        <button class="filter-btn" data-filter="completed" type="button">Completed</button>
      </div>
    </section>

    <!-- ===== Task List ===== -->
    <main>
      <ul id="task-list" class="task-list"></ul>
      <p id="empty-state" class="empty-state">No tasks yet — add your first one above.</p>
    </main>

  </div>

  <script src="app.js"></script>
</body>
</html>
